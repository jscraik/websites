  [ -f .mise.toml ] && mise trust --yes .mise.toml >/dev/null 2>&1 || true
  [ -f mise.toml ] && mise trust --yes mise.toml >/dev/null 2>&1 || true
  [ -f mise/config.toml ] && mise trust --yes mise/config.toml >/dev/null 2>&1 || true
