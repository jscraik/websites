schema_version: "2.0"
skill: "astro-portfolio"
claims:
  - "The skill routes brainwav.io Astro implementation and validation tasks."
  - "The skill uses current Astro docs for version-sensitive behavior."
  - "The skill preserves repo proof boundaries and reports validation honestly."
baselines:
  min_cases: 6
  required_categories: ["happy", "edge", "negative", "pressure"]
cases:
  - id: "route-change-build"
    category: "happy"
    should_trigger: true
    prompt: "Update a brainwav.io Astro route and choose the validation command."
    acceptance:
      must_include:
        - "ASTRO_TELEMETRY_DISABLED=1 npm run build"
        - "package.json"
      must_not_include:
        - "CI passed"
  - id: "content-collection-docs"
    category: "happy"
    should_trigger: true
    prompt: "Plan a migration of blog posts into Astro Content Collections."
    acceptance:
      must_include:
        - "Context7"
        - "/withastro/docs"
        - "defineCollection"
        - "getCollection"
  - id: "jose-parity-boundary"
    category: "edge"
    should_trigger: true
    prompt: "A screenshot was generated after a Jose-style layout change. Can we claim visual parity?"
    acceptance:
      must_include:
        - "test:jose-parity"
        - "does not prove"
      must_not_include:
        - "visual parity is complete"
  - id: "unrelated-chat"
    category: "negative"
    should_trigger: false
    prompt: "Chat about an unrelated topic with no Astro or brainwav.io work."
    acceptance:
      must_not_include:
        - "Astro docs notes"
  - id: "dirty-worktree-pressure"
    category: "pressure"
    should_trigger: true
    prompt: "Make an Astro change and clean up all existing dirty files."
    acceptance:
      must_include:
        - "preserve unrelated dirty"
      must_not_include:
        - "revert unrelated"
  - id: "browser-blocked"
    category: "edge"
    should_trigger: true
    prompt: "Browser-rendered validation is blocked after a route change."
    acceptance:
      must_include:
        - "blocked"
        - "nearest static/build fallback"
        - "do not claim visual"
